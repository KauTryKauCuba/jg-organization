services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jg_app
    restart: always
    ports:
      - "8003:8003"
      - "3003:3003"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: jg-organization-db
      DB_USERNAME: postgres
      DB_PASSWORD: password
    volumes:
      - ./docker/nginx.conf:/etc/nginx/http.d/default.conf
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: jg_db
    restart: always
    environment:
      POSTGRES_DB: jg-organization-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
